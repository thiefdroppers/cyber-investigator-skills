<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#f7f7f5"/>

  <!-- anchor points (top-center of each card, where its pin sits) -->
  <!-- 1:150,70  2:330,50  3:520,80  4:710,60  5:185,255  6:385,225  7:600,245  8:780,210 -->

  <!-- string connections, drawn first so cards and pins sit on top -->
  <g stroke="#0d4da5" stroke-width="2.5" fill="none" opacity="0.9">
    <line x1="150" y1="70" x2="330" y2="50"/>
    <line x1="330" y1="50" x2="520" y2="80"/>
    <line x1="520" y1="80" x2="710" y2="60"/>
    <line x1="150" y1="70" x2="185" y2="255"/>
    <line x1="330" y1="50" x2="385" y2="225"/>
    <line x1="385" y1="225" x2="185" y2="255"/>
    <line x1="385" y1="225" x2="600" y2="245"/>
    <line x1="520" y1="80" x2="600" y2="245"/>
    <line x1="710" y1="60" x2="780" y2="210"/>
    <line x1="600" y1="245" x2="780" y2="210"/>
    <line x1="385" y1="225" x2="520" y2="80" stroke-dasharray="6 5" opacity="0.55"/>
  </g>

  <!-- blank cards, each a slightly rotated rounded rectangle, top edge at its anchor point -->
  <g fill="#ffffff" stroke="#000000" stroke-width="2">
    <rect x="-55" y="0" width="110" height="78" rx="4" transform="translate(150,70) rotate(-6)"/>
    <rect x="-55" y="0" width="110" height="78" rx="4" transform="translate(330,50) rotate(4)"/>
    <rect x="-55" y="0" width="110" height="78" rx="4" transform="translate(520,80) rotate(-3)"/>
    <rect x="-55" y="0" width="110" height="78" rx="4" transform="translate(710,60) rotate(5)"/>
    <rect x="-55" y="0" width="110" height="78" rx="4" transform="translate(185,255) rotate(6)"/>
    <rect x="-55" y="0" width="110" height="78" rx="4" transform="translate(385,225) rotate(-4)"/>
    <rect x="-55" y="0" width="110" height="78" rx="4" transform="translate(600,245) rotate(5)"/>
    <rect x="-55" y="0" width="110" height="78" rx="4" transform="translate(780,210) rotate(-5)"/>
  </g>

  <!-- pins on top, at each card's anchor point -->
  <g fill="#000000">
    <circle cx="150" cy="70" r="6"/>
    <circle cx="330" cy="50" r="6"/>
    <circle cx="520" cy="80" r="6"/>
    <circle cx="710" cy="60" r="6"/>
    <circle cx="185" cy="255" r="6"/>
    <circle cx="385" cy="225" r="6"/>
    <circle cx="600" cy="245" r="6"/>
    <circle cx="780" cy="210" r="6"/>
  </g>
</svg>
