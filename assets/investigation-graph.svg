<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="pin" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6b5b"/>
      <stop offset="100%" stop-color="#b3261e"/>
    </radialGradient>
    <linearGradient id="cork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a46b"/>
      <stop offset="100%" stop-color="#a97f4d"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#3a2a12" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="url(#cork)"/>
  <g fill="#8a6339" opacity="0.35">
    <circle cx="40" cy="30" r="1.6"/><circle cx="95" cy="70" r="1.3"/><circle cx="160" cy="20" r="1.5"/>
    <circle cx="230" cy="55" r="1.4"/><circle cx="300" cy="15" r="1.6"/><circle cx="370" cy="65" r="1.3"/>
    <circle cx="440" cy="25" r="1.5"/><circle cx="510" cy="60" r="1.4"/><circle cx="580" cy="18" r="1.6"/>
    <circle cx="650" cy="58" r="1.3"/><circle cx="720" cy="22" r="1.5"/><circle cx="790" cy="62" r="1.4"/>
    <circle cx="860" cy="28" r="1.6"/><circle cx="30" cy="150" r="1.4"/><circle cx="100" cy="190" r="1.5"/>
    <circle cx="180" cy="160" r="1.3"/><circle cx="260" cy="200" r="1.6"/><circle cx="340" cy="155" r="1.4"/>
    <circle cx="420" cy="195" r="1.5"/><circle cx="500" cy="150" r="1.3"/><circle cx="580" cy="198" r="1.6"/>
    <circle cx="660" cy="158" r="1.4"/><circle cx="740" cy="192" r="1.5"/><circle cx="820" cy="152" r="1.3"/>
    <circle cx="60" cy="320" r="1.5"/><circle cx="140" cy="360" r="1.4"/><circle cx="220" cy="330" r="1.6"/>
    <circle cx="300" cy="365" r="1.3"/><circle cx="380" cy="325" r="1.5"/><circle cx="460" cy="370" r="1.4"/>
    <circle cx="540" cy="328" r="1.6"/><circle cx="620" cy="362" r="1.3"/><circle cx="700" cy="332" r="1.5"/>
    <circle cx="780" cy="368" r="1.4"/><circle cx="850" cy="330" r="1.6"/>
  </g>

  <!-- sagging string between pins, drawn before cards -->
  <g stroke="#c0392b" stroke-width="2.5" fill="none" opacity="0.95" stroke-linecap="round">
    <path d="M150,70 Q240,105 330,50"/>
    <path d="M330,50 Q425,95 520,80"/>
    <path d="M520,80 Q615,105 710,60"/>
    <path d="M150,70 Q135,165 185,255"/>
    <path d="M330,50 Q355,145 385,225"/>
    <path d="M385,225 Q285,255 185,255"/>
    <path d="M385,225 Q495,255 600,245"/>
    <path d="M520,80 Q555,170 600,245"/>
    <path d="M710,60 Q755,140 780,210"/>
    <path d="M600,245 Q690,245 780,210"/>
    <path d="M385,225 Q450,155 520,80" stroke-dasharray="7 6" opacity="0.6"/>
  </g>

  <!-- card drop shadows -->
  <g fill="#3a2a12" opacity="0.001"></g>

  <!-- document-style cards: white with redacted text bars -->
  <g filter="url(#cardShadow)">
    <g transform="translate(150,70) rotate(-6)">
      <rect x="-55" y="0" width="110" height="78" rx="3" fill="#fbfaf6" stroke="#2b2b2b" stroke-width="1.5"/>
      <rect x="-42" y="14" width="84" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="27" width="70" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="40" width="76" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="53" width="55" height="6" fill="#b9b3a4"/>
    </g>
    <g transform="translate(520,80) rotate(-3)">
      <rect x="-55" y="0" width="110" height="78" rx="3" fill="#fbfaf6" stroke="#2b2b2b" stroke-width="1.5"/>
      <rect x="-42" y="14" width="84" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="27" width="60" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="40" width="80" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="53" width="48" height="6" fill="#b9b3a4"/>
    </g>
    <g transform="translate(385,225) rotate(-4)">
      <rect x="-55" y="0" width="110" height="78" rx="3" fill="#fbfaf6" stroke="#2b2b2b" stroke-width="1.5"/>
      <rect x="-42" y="14" width="70" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="27" width="84" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="40" width="58" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="53" width="76" height="6" fill="#b9b3a4"/>
    </g>
    <g transform="translate(780,210) rotate(-5)">
      <rect x="-55" y="0" width="110" height="78" rx="3" fill="#fbfaf6" stroke="#2b2b2b" stroke-width="1.5"/>
      <rect x="-42" y="14" width="80" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="27" width="64" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="40" width="84" height="6" fill="#b9b3a4"/>
      <rect x="-42" y="53" width="50" height="6" fill="#b9b3a4"/>
    </g>
  </g>

  <!-- photo-style cards: white border frame with a generic silhouette -->
  <g filter="url(#cardShadow)">
    <g transform="translate(330,50) rotate(4)">
      <rect x="-50" y="-3" width="100" height="84" rx="2" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
      <rect x="-42" y="5" width="84" height="60" fill="#dfe3e6"/>
      <circle cx="0" cy="24" r="13" fill="#9aa4ab"/>
      <path d="M-22,62 Q0,32 22,62 Z" fill="#9aa4ab"/>
    </g>
    <g transform="translate(710,60) rotate(5)">
      <rect x="-50" y="-3" width="100" height="84" rx="2" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
      <rect x="-42" y="5" width="84" height="60" fill="#dfe3e6"/>
      <circle cx="0" cy="24" r="13" fill="#9aa4ab"/>
      <path d="M-22,62 Q0,32 22,62 Z" fill="#9aa4ab"/>
    </g>
    <g transform="translate(185,255) rotate(6)">
      <rect x="-50" y="-3" width="100" height="84" rx="2" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
      <rect x="-42" y="5" width="84" height="60" fill="#dfe3e6"/>
      <circle cx="0" cy="24" r="13" fill="#9aa4ab"/>
      <path d="M-22,62 Q0,32 22,62 Z" fill="#9aa4ab"/>
    </g>
    <g transform="translate(600,245) rotate(5)">
      <rect x="-50" y="-3" width="100" height="84" rx="2" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
      <rect x="-42" y="5" width="84" height="60" fill="#dfe3e6"/>
      <circle cx="0" cy="24" r="13" fill="#9aa4ab"/>
      <path d="M-22,62 Q0,32 22,62 Z" fill="#9aa4ab"/>
    </g>
  </g>

  <!-- pushpins on top -->
  <g>
    <circle cx="150" cy="70" r="7" fill="url(#pin)" stroke="#7a1a14" stroke-width="0.5"/>
    <circle cx="330" cy="50" r="7" fill="url(#pin)" stroke="#7a1a14" stroke-width="0.5"/>
    <circle cx="520" cy="80" r="7" fill="url(#pin)" stroke="#7a1a14" stroke-width="0.5"/>
    <circle cx="710" cy="60" r="7" fill="url(#pin)" stroke="#7a1a14" stroke-width="0.5"/>
    <circle cx="185" cy="255" r="7" fill="url(#pin)" stroke="#7a1a14" stroke-width="0.5"/>
    <circle cx="385" cy="225" r="7" fill="url(#pin)" stroke="#7a1a14" stroke-width="0.5"/>
    <circle cx="600" cy="245" r="7" fill="url(#pin)" stroke="#7a1a14" stroke-width="0.5"/>
    <circle cx="780" cy="210" r="7" fill="url(#pin)" stroke="#7a1a14" stroke-width="0.5"/>
  </g>
</svg>
