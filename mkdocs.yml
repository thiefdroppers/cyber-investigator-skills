site_name: Cyber Investigator Roadmap
site_description: "A 90-day, practical path into cyber investigation: OSINT, threat intelligence, digital forensics, and fraud investigation."
repo_url: https://github.com/thiefdroppers/cyber-investigator-roadmap
repo_name: cyber-investigator-roadmap
docs_dir: docs
site_dir: site
exclude_docs: |
  curriculum/_template.md
  curriculum/phase-4-digital-forensics-incident-investigation/resources/INSTRUCTOR-KEY.md
  curriculum/phase-6-cloud-ai-system-investigation/resources/INSTRUCTOR-KEY.md
  curriculum/phase-7-capstone-career/case-packet/07-instructor-key.md

theme:
  name: material
  palette:
    - scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

